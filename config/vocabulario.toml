# Vocabulario controlado del corpus MET+CMA (fuente de verdad única).
#
# Basado en los Cuadros 6.3 a 6.8 del avance de tesis. En los datos se guarda
# el código (minúsculas, sin tildes ni espacios); la etiqueta es la forma de la
# tesis para documentos, figuras y el workbook de anotación.
#
# Cada campo:
#   familia     visual | composicional | tecnica | iconografica | control | curatorial
#   cuadro      cuadro de la tesis que lo define
#   multiple    true si admite varios valores separados por "; "
#   anotable    true si se registra en el workbook de anotación manual
#   valores     [codigo, etiqueta] o [codigo, etiqueta, "extension"] cuando el valor
#               no figura en la tesis y lo agregó la curación del corpus.

# --------------------------------------------------------------- familia visual (6.3)

[campos.color_dominante]
familia = "visual"
cuadro = "6.3"
descripcion = "Color visualmente predominante."
multiple = false
anotable = true
valores = [
    ["rojo", "rojo"], ["marron", "marrón"], ["crema", "crema"], ["negro", "negro"],
    ["azul", "azul"], ["amarillo", "amarillo"], ["verde", "verde"], ["multicolor", "multicolor"],
]

[campos.colores]
familia = "visual"
cuadro = "6.3"
descripcion = "Lista breve de colores visibles."
multiple = true
anotable = true
valores = [
    ["rojo", "rojo"], ["marron", "marrón"], ["crema", "crema"], ["negro", "negro"],
    ["azul", "azul"], ["amarillo", "amarillo"], ["verde", "verde"],
    ["blanco", "blanco", "extension"], ["naranja", "naranja", "extension"], ["rosado", "rosado", "extension"],
    ["morado", "morado", "extension"], ["gris", "gris", "extension"],
]

[campos.contraste]
familia = "visual"
cuadro = "6.3"
descripcion = "Diferencia visual entre zonas cromáticas."
multiple = false
anotable = true
valores = [["bajo", "bajo"], ["medio", "medio"], ["alto", "alto"]]

[campos.densidad_visual]
familia = "visual"
cuadro = "6.3"
descripcion = "Saturación de elementos visuales en la superficie."
multiple = false
anotable = true
valores = [["baja", "baja"], ["media", "media"], ["alta", "alta"]]

