# Conteos esperados del corpus por fuente y etapa.
# El flujo (python -m src.flujo) falla si alguna salida no coincide.

[met.base]
descripcion = "Salidas MET v2 construidas desde el corpus MET v1"
principal = { ruta = "data/metadata/met_corpus_principal_v2.csv", filas = 132 }
secundario = { ruta = "data/metadata/met_corpus_secundario_v2.csv", filas = 50 }
descartados = { ruta = "data/metadata/met_descartados_v2.csv", filas = 29 }

[met.revisado]
descripcion = "Salidas MET v2 tras aplicar data/metadata/met_revision_manual_v2.xlsx"
# 2026-10-20: revision con el criterio v2 (data/metadata/revision_criterio_v2_met_cma.xlsx, trasladada con
# src/imagenes/revision_v2.py): 25 de secundario y 2 de descartados suben a principal; los 7 pendientes se
# resuelven (6 descartados, 1 secundario); el resto se confirma con motivo nuevo.
# 2026-10-19: reglas del criterio AIC aplicadas a MET (src/imagenes/aptitud_workbooks.py --solo-reglas):
# 15 fotografias en blanco y negro de principal a secundario; a descartados, 20 piezas con plumaria
# (secundario), 4 posteriores a 1532 y 4 con resolucion insuficiente (principal) y MET:312615, sin
# imagen en el museo (secundario). Las sugerencias del modelo de imagen no se aplicaron: la validacion
# ciega dio kappa 0,56 (< 0,6; outputs/reports/validacion_met_cma_v2.md). El consolidado v1 lee las
# copias congeladas de data/metadata/v1_congelado/ y no cambia.
# 2026-10-19: decisiones de la validacion ciega trasladadas (src/imagenes/validacion.py --trasladar):
# MET:316978 a principal, MET:307970 a secundario, MET:310698 a descartados y MET:307683 a revisar
# (la anotacion contradice su propio motivo). El revisor resolvio MET:307683 a principal (2026-10-19).
principal = { ruta = "data/metadata/met_corpus_principal_v2_revisado.csv", filas = 130 }
secundario = { ruta = "data/metadata/met_corpus_secundario_v2_revisado.csv", filas = 25 }
# 2026-10-14: 2 de los 9 recuperados descartados automaticamente por plumaria (regla de pertinencia del puntaje de aptitud).
descartados = { ruta = "data/metadata/met_descartados_v2_revisado.csv", filas = 65 }
# 9 registros excluidos por el filtro v1 y recuperados por el filtro corregido (2026-10-05), pendientes de revision visual.
pendientes = { ruta = "data/metadata/met_pendientes_revision_v2.csv", filas = 0 }

[cma.candidatos]
descripcion = "Candidatos CMA normalizados"
candidatos = { ruta = "data/metadata/cma_andes_textiles_candidates.csv", filas = 146 }

[cma.revisado]
descripcion = "Salidas CMA v2 tras aplicar data/metadata/cma_revision_manual_v2.xlsx"
# 2026-10-20: revision con el criterio v2: 8 de secundario y 5 de descartados suben a principal, 5 de
# secundario pasan a descartados y 2 descartados a secundario; el resto se confirma con motivo nuevo.
# 2026-10-19: 5 piezas con plumaria de secundario a descartados (reglas del criterio AIC).
# 2026-10-19: validacion ciega trasladada: CMA:124412, CMA:294034 y CMA:294068 a principal;
# CMA:126269 y CMA:165270 de descartados a secundario.
# 2026-10-20: mismo esquema y patron de nombres que MET y AIC (antes cma_*_revisado.csv con el esquema
# heredado de CMA v1 y BOM); los conteos no cambian. El consolidado v1 lee data/metadata/v1_congelado/.
principal = { ruta = "data/metadata/cma_corpus_principal_v2_revisado.csv", filas = 104 }
secundario = { ruta = "data/metadata/cma_corpus_secundario_v2_revisado.csv", filas = 4 }
descartados = { ruta = "data/metadata/cma_descartados_v2_revisado.csv", filas = 38 }
pendientes = { ruta = "data/metadata/cma_pendientes_revision_v2.csv", filas = 0 }

[aic.candidatos]
descripcion = "Candidatos AIC normalizados (src/collectors/aic_collector.py, 2026-10-05)"
candidatos = { ruta = "data/metadata/aic_andes_textiles_candidates.csv", filas = 508 }

[aic.revisado]
descripcion = "Salidas AIC v2 tras aplicar data/metadata/aic_revision_manual_v2.xlsx"
# Revision en curso (2026-10-14), manual y automatica (src/imagenes/aptitud_workbooks.py):
# - 2026-10-13: 73 decisiones manuales; 96 fotografias en blanco y negro al secundario y
#   2 por resolucion insuficiente a descartados (automaticas).
# - 2026-10-14: nuevas decisiones manuales (incluidas 10 correcciones de filas automaticas)
#   y 9 descartes automaticos por pertinencia (7 posteriores a 1532 y 2 con plumaria); una
#   fotografia monocroma posterior a 1532 paso de secundario a descartados.
# - 61 herramientas textiles descartadas automaticamente por el filtro (2026-10-05).
# - 2026-10-15: revision manual completa (corpus_final, decision y motivo en todos los registros).
# - 2026-10-19: AIC:85497 pasa de revisar a principal (su motivo la marcaba como la mejor imagen).
principal = { ruta = "data/metadata/aic_corpus_principal_v2_revisado.csv", filas = 228 }
secundario = { ruta = "data/metadata/aic_corpus_secundario_v2_revisado.csv", filas = 124 }
descartados = { ruta = "data/metadata/aic_descartados_v2_revisado.csv", filas = 156 }
pendientes = { ruta = "data/metadata/aic_pendientes_revision_v2.csv", filas = 0 }

[corpus_v2.principal]
descripcion = "Corpus principal v2 armonizado (src/anotacion/corpus_v2.py): union de los principales revisados"
# 2026-10-20: primera construccion, base de la anotacion estructural v2. MET 130 + CMA 104 + AIC 228; debe
# coincidir con la suma de met.revisado, cma.revisado y aic.revisado (principal).
principal = { ruta = "data/processed/corpus_textiles_andinos_v2_principal.csv", filas = 462 }

[consolidado.conteos]
# Principal y complementario de MET v2 revisado y CMA v2 revisado.
# MET:312615 paso de principal a complementario (imagen no disponible en el museo, 2026-10-05).
MET_principal = 126
MET_complementario = 55
CMA_principal = 88
CMA_complementario = 19
total = 288

[consolidado.parametros]
# Lado mayor minimo (px) para considerar una imagen util en lugar de baja_resolucion.
# La copia local de MET es la version web-large del museo (lado mayor 595-625 px).
lado_minimo_imagen = 500
# Distancia de Hamming maxima entre dHash para listar un par como posible duplicado visual.
umbral_dhash = 4

[consolidado.salidas]
consolidado = { ruta = "data/processed/corpus_textiles_andinos_met_cma_v1_consolidado.csv", filas = 288 }
fuentes_licencias = { ruta = "data/processed/corpus_textiles_andinos_met_cma_v1_fuentes_licencias.csv", filas = 2 }
manifiesto_imagenes = { ruta = "data/metadata/imagenes_manifiesto_met_cma_v1.csv", filas = 288 }
