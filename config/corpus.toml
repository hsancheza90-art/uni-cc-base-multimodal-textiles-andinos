# Conteos esperados del corpus por fuente y etapa.
# El flujo (python -m src.flujo) falla si alguna salida no coincide.

[met.base]
descripcion = "Salidas MET v2 construidas desde el corpus MET v1"
principal = { ruta = "data/metadata/met_corpus_principal_v2.csv", filas = 132 }
secundario = { ruta = "data/metadata/met_corpus_secundario_v2.csv", filas = 50 }
descartados = { ruta = "data/metadata/met_descartados_v2.csv", filas = 29 }

[met.revisado]
descripcion = "Salidas MET v2 tras aplicar data/metadata/met_revision_manual_v2.xlsx"
principal = { ruta = "data/metadata/met_corpus_principal_v2_revisado.csv", filas = 126 }
secundario = { ruta = "data/metadata/met_corpus_secundario_v2_revisado.csv", filas = 55 }
descartados = { ruta = "data/metadata/met_descartados_v2_revisado.csv", filas = 30 }
# 9 registros excluidos por el filtro v1 y recuperados por el filtro corregido (2026-10-05), pendientes de revision visual.
pendientes = { ruta = "data/metadata/met_pendientes_revision_v2.csv", filas = 9 }

[cma.candidatos]
descripcion = "Candidatos CMA normalizados"
candidatos = { ruta = "data/metadata/cma_andes_textiles_candidates.csv", filas = 146 }

[cma.revisado]
descripcion = "Salidas CMA v2 tras aplicar data/metadata/cma_revision_manual_v2.xlsx"
principal = { ruta = "data/metadata/cma_corpus_principal_revisado.csv", filas = 88 }
secundario = { ruta = "data/metadata/cma_corpus_secundario_revisado.csv", filas = 19 }
descartados = { ruta = "data/metadata/cma_descartados_revisado.csv", filas = 39 }
pendientes = { ruta = "data/metadata/cma_pendientes_revision_v2.csv", filas = 0 }

[consolidado.conteos]
# Principal y complementario de MET v2 revisado y CMA v2 revisado.
# MET:312615 paso de principal a complementario (imagen no disponible en el museo, 2026-10-05).
MET_principal = 126
MET_complementario = 55
CMA_principal = 88
CMA_complementario = 19
total = 288

[consolidado.parametros]
# Lado mayor minimo (px) para considerar una imagen util en lugar de baja_resolucion.
# La copia local de MET es la version web-large del museo (lado mayor 595-625 px).
lado_minimo_imagen = 500
# Distancia de Hamming maxima entre dHash para listar un par como posible duplicado visual.
umbral_dhash = 4

[consolidado.salidas]
consolidado = { ruta = "data/processed/corpus_textiles_andinos_met_cma_v1_consolidado.csv", filas = 288 }
fuentes_licencias = { ruta = "data/processed/corpus_textiles_andinos_met_cma_v1_fuentes_licencias.csv", filas = 2 }
manifiesto_imagenes = { ruta = "data/metadata/imagenes_manifiesto_met_cma_v1.csv", filas = 288 }
