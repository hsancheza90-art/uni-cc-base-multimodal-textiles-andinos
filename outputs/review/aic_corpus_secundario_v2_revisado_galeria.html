<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Galeria AIC v2 revisada - secundario</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 24px;
      background: #f6f6f4;
      color: #222;
    }
    header {
      margin-bottom: 20px;
      max-width: 1100px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }
    .nota {
      color: #555;
      line-height: 1.45;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
    }
    .card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
    }
    .imagen {
      display: block;
      background: #eee;
      height: 280px;
    }
    img {
      width: 100%;
      height: 280px;
      object-fit: contain;
      background: #eee;
    }
    .sin-imagen {
      height: 280px;
      display: grid;
      place-items: center;
      color: #777;
      background: #eee;
    }
    .body {
      padding: 14px;
    }
    .badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .badges span {
      background: #e9eef4;
      color: #1f4e78;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: bold;
    }
    h2 {
      font-size: 17px;
      margin: 0 0 6px;
    }
    .subtitulo {
      color: #666;
      font-style: italic;
    }
    p {
      margin: 6px 0;
      font-size: 14px;
      line-height: 1.35;
    }
    .motivo,
    .observaciones {
      color: #444;
    }
    .link {
      display: inline-block;
      margin-top: 10px;
      color: #0645ad;
    }
  </style>
</head>
<body>
  <header>
    <h1>Galeria AIC v2 revisada - secundario</h1>
    <p class="nota">Total de registros: 0. Esta galeria se genera desde los CSV revisados de AIC v2.</p>
  </header>
  <main class="grid">
    
  </main>
</body>
</html>
