[project]
name = "uni-cc-base-multimodal-textiles-andinos"
version = "2.0.0"
description = "Corpus multimodal curado de textiles andinos (The Met, Cleveland Museum of Art y Art Institute of Chicago)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Henry Sánchez", email = "hsancheza90@gmail.com" }]
dependencies = [
    "numpy>=2.0",
    "openpyxl>=3.1",
    "Pillow>=10.1",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Sistemas de recuperacion (M2, OpenCLIP), fuera del flujo. Versiones exactas en requirements-modelos.txt.
modelos = ["torch>=2.14", "torchvision>=0.29", "open_clip_torch>=3.3", "transformers>=5", "sentencepiece>=0.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
